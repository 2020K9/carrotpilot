<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.card{background:linear-gradient(180deg,#07080d 0%,#0a0d18 55%,#0b1426 100%);border:1px solid #6d5a2e;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 4px #14110b,inset 0 0 0 5px #3a311c}
.gold{background:linear-gradient(180deg,#f7e3a8 0%,#d8b25e 45%,#a87f2e 80%,#e9cf86 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#scene{position:absolute;left:0;top:0}
.top{position:absolute;left:26px;right:26px;top:20px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.emb{width:42px;height:42px;border-radius:50%;border:1.5px solid #c9a457;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#e3c27a;background:radial-gradient(circle at 35% 30%,#2a2416,#0d0c09)}
.bt{font-size:12px;letter-spacing:.38em;color:#bfa265}
.bs{font-size:19px;font-weight:500;color:#efe6d2;margin-top:1px;letter-spacing:.04em}
.pill{border:1px solid #c9a457;color:#f0d690;padding:6px 16px;border-radius:999px;font-size:16px;font-weight:500;letter-spacing:.12em;display:flex;align-items:center;gap:9px}
.pill i{width:9px;height:9px;border-radius:50%;background:#f3cf6b;box-shadow:0 0 10px #f3cf6b}
.lbl{position:absolute;left:28px;top:84px;font-size:14px;letter-spacing:.3em;color:#a8915f;z-index:5}
.fare{position:absolute;left:24px;top:94px;display:flex;align-items:flex-end;gap:10px;z-index:5;transform-origin:20% 80%}
.fare .v{font-size:98px;font-weight:300;line-height:1;letter-spacing:-.01em}
.fare .u{font-size:30px;font-weight:300;color:#d9bd7c;margin-bottom:14px}
#plus{position:absolute;left:372px;top:104px;font-size:30px;font-weight:700;color:#ffe08a;text-shadow:0 0 14px #f3cf6b;z-index:6;opacity:0}
.stats{position:absolute;left:560px;top:80px;width:190px;z-index:5}
.stats .it{padding:7px 0 9px;border-bottom:1px solid #2a2618}
.stats .k{font-size:12px;color:#a8915f;letter-spacing:.2em}
.stats .x{font-size:27px;color:#f2ead8;margin-top:2px}
.stats .x small{font-size:15px;color:#b9a77f;margin-left:4px}
.next{position:absolute;left:28px;top:340px;font-size:14px;color:#a8915f;letter-spacing:.05em;z-index:5}
.next b{color:#f0d690;font-weight:600}
.bub{position:absolute;z-index:7;background:#fffdf6;color:#2b3448;font-size:17px;font-weight:700;padding:7px 14px;border-radius:16px;white-space:nowrap;opacity:0;box-shadow:0 2px 10px #0006}
.bub.say:after{content:"";position:absolute;bottom:-11px;left:22px;border:7px solid transparent;border-top-color:#fffdf6;border-bottom:0}
.th i{position:absolute;background:#fffdf6;border-radius:50%}
#tak{position:absolute;z-index:7;font-size:22px;font-weight:900;color:#ffe08a;text-shadow:0 0 8px #000,0 0 12px #f3cf6b;opacity:0}
.foot{z-index:5;left:24px;bottom:12px;opacity:1;font-size:13px;color:#e8dcc0;text-shadow:0 1px 3px #000}
.foot b{display:block;font-size:11px;letter-spacing:.18em;color:#c9a457;font-weight:500;margin-bottom:2px}
.foot i{font-style:normal;color:#8f7b52;margin:0 7px}
</style></head><body><div class="card">
<svg id="scene" width="776" height="456" viewBox="0 0 776 456">
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16325e"/><stop offset="1" stop-color="#0a1730"/></linearGradient>
 <linearGradient id="trk" gradientUnits="userSpaceOnUse" x1="28" y1="0" x2="500" y2="0"><stop offset="0" stop-color="#7a5f27"/><stop offset="1" stop-color="#f1d68f"/></linearGradient>
 <radialGradient id="moon"><stop offset="0" stop-color="#fff6d6"/><stop offset=".6" stop-color="#f3d98e"/><stop offset="1" stop-color="#f3d98e" stop-opacity="0"/></radialGradient>
 <clipPath id="above"><rect x="0" y="0" width="776" height="404"/></clipPath>
 <g id="shellG"><path d="M0 -15 Q17 -14 19 3 Q12 12 0 12 Q-12 12 -19 3 Q-17 -14 0 -15Z" fill="#f4a3c0" stroke="#5a2a3c" stroke-width="1.6"/><path d="M0 -13 L0 11 M-7 -11 L-4 11 M7 -11 L4 11 M-13 -6 L-9 9 M13 -6 L9 9" stroke="#5a2a3c" stroke-width="1" opacity=".55"/><rect x="-6" y="10" width="12" height="5" rx="2" fill="#f4a3c0" stroke="#5a2a3c" stroke-width="1.4"/></g>
</defs>
<g id="stars"></g>
<circle id="moonC" cx="505" cy="62" r="34" fill="url(#moon)" opacity=".9"/>
<line id="shoot" x1="0" y1="0" x2="0" y2="0" stroke="#fff3c4" stroke-width="2" stroke-linecap="round" opacity="0"/>
<!-- track -->
<line x1="28" y1="326" x2="500" y2="326" stroke="#2b2618" stroke-width="3"/>
<line id="trkF" x1="28" y1="326" x2="28" y2="326" stroke="url(#trk)" stroke-width="4" stroke-linecap="round"/>
<use href="#shellG" id="goal" x="516" y="318"/>
<!-- Porori -->
<g id="poro">
 <g id="ptail">
  <path d="M-8 18 C-60 30 -78 -10 -62 -38 C-48 -62 -10 -56 -14 -30 C-17 -12 -40 -14 -40 -28" fill="#ec6b7d" stroke="#5b2430" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M-12 14 C-46 22 -64 -2 -56 -26 C-48 -46 -24 -46 -24 -32" fill="none" stroke="#fde9ee" stroke-width="7" stroke-linecap="round"/>
  <path d="M-58 -16 l6 -3 l-2 6 l6 -3 M-52 -40 l5 2 l-1 -5 l5 2 M-34 -52 l2 5 l3 -5 l2 5" fill="none" stroke="#3a1a22" stroke-width="1.6"/>
 </g>
 <ellipse cx="-9" cy="46" rx="8" ry="4" fill="#fde9ee" stroke="#5b2430" stroke-width="1.8" id="pfL"/>
 <ellipse cx="9" cy="46" rx="8" ry="4" fill="#fde9ee" stroke="#5b2430" stroke-width="1.8" id="pfR"/>
 <path d="M-15 -2 Q-19 22 -14 44 L14 44 Q19 22 15 -2 Z" fill="#ec6b7d" stroke="#5b2430" stroke-width="2.2"/>
 <ellipse cx="0" cy="24" rx="8.5" ry="15" fill="#fde9ee"/>
 <path d="M-14 6 L-21 20" stroke="#5b2430" stroke-width="2" stroke-linecap="round" id="paL"/><path d="M14 6 L21 20" stroke="#5b2430" stroke-width="2" stroke-linecap="round" id="paR"/>
 <g id="phead">
  <ellipse cx="-11" cy="-62" rx="7" ry="11" fill="#ec6b7d" stroke="#5b2430" stroke-width="2"/><ellipse cx="-11" cy="-60" rx="3.6" ry="7" fill="#f6e3c0"/>
  <ellipse cx="11" cy="-62" rx="7" ry="11" fill="#ec6b7d" stroke="#5b2430" stroke-width="2"/><ellipse cx="11" cy="-60" rx="3.6" ry="7" fill="#f6e3c0"/>
  <ellipse cx="0" cy="-28" rx="25" ry="31" fill="#ec6b7d" stroke="#5b2430" stroke-width="2.2"/>
  <path d="M-15 -26 Q-22 -6 -8 2 Q0 4 8 2 Q22 -6 15 -26 Q8 -16 0 -16 Q-8 -16 -15 -26Z" fill="#fde9ee"/>
  <path d="M-4 -56 l0 7 M0 -57 l0 7 M4 -56 l0 7" stroke="#3a1a22" stroke-width="1.6" stroke-linecap="round"/>
  <g id="peyes"><circle cx="-14" cy="-34" r="2.6" fill="#1d1d1f"/><circle cx="14" cy="-34" r="2.6" fill="#1d1d1f"/></g>
  <circle cx="0" cy="-17" r="5.6" fill="#1d1d1f"/>
  <path id="pmouth" d="M-4 -8 L4 -8 L0 -1 Z" fill="#f58ca8" stroke="#5b2430" stroke-width="1.2" stroke-linejoin="round"/>
 </g>
</g>
<!-- Bonobono -->
<g clip-path="url(#above)"><g id="bono">
 <path d="M-34 50 Q-54 72 -52 160 L52 160 Q54 72 34 50 Z" fill="#3f9ee8" stroke="#163a5e" stroke-width="2.5"/>
 <ellipse cx="0" cy="0" rx="58" ry="70" fill="#3f9ee8" stroke="#163a5e" stroke-width="2.5"/>
 <g id="beyes"><circle cx="-42" cy="-22" r="4.6" fill="#141414"/><circle cx="42" cy="-22" r="4.6" fill="#141414"/></g>
 <g id="muz"><circle cx="-14" cy="26" r="17" fill="#fff" stroke="#163a5e" stroke-width="2"/><circle cx="14" cy="26" r="17" fill="#fff" stroke="#163a5e" stroke-width="2"/><rect x="-14" y="22" width="28" height="18" fill="#fff"/><path d="M-14 43 Q0 47 14 43" fill="none" stroke="#163a5e" stroke-width="2"/></g>
 <ellipse cx="0" cy="10" rx="12" ry="10.5" fill="#141414"/>
 <g stroke="#163a5e" stroke-width="1.5" stroke-linecap="round"><path d="M-22 20 L-48 14 M-23 27 L-50 27 M-22 34 L-47 40 M22 20 L48 14 M23 27 L50 27 M22 34 L47 40"/></g>
 <g id="barm"><path d="M38 70 Q58 88 44 106" fill="none" stroke="#163a5e" stroke-width="2.5"/><use href="#shellG" x="30" y="94" transform="rotate(-10 30 94)"/></g>
 <path d="M-38 74 Q-52 92 -36 104" fill="#3f9ee8" stroke="#163a5e" stroke-width="2.5"/>
</g></g>
<!-- sea -->
<path id="w1" fill="#13305a" opacity=".95"/>
<path id="w2" fill="url(#sea)"/>
<path id="w3" fill="#0d2246" opacity=".9"/>
<g id="glint"></g>
</svg>
<div class="top"><div class="brand"><div class="emb">모범</div><div><div class="bt">DELUXE TAXI</div><div class="bs">보노보노 모범택시</div></div></div><div class="pill"><i></i>주행</div></div>
<div class="lbl">운행 요금</div>
<div class="fare" id="fareBox"><span class="v num gold" id="fare">14,400</span><span class="u">원</span></div>
<div id="plus">+200원</div>
<div class="stats">
 <div class="it"><div class="k">운행 거리</div><div class="x num" id="dist">8.43<small>km</small></div></div>
 <div class="it" style="border:none"><div class="k">운행 시간</div><div class="x num" id="tm">00:18:32</div></div>
 </div>
<div class="next">다음 <b>+200원</b>까지 <b class="num" id="rem">115</b> m</div>
<div class="bub th" id="bth">언제 도착하는 걸까…<i style="width:12px;height:12px;right:30px;bottom:-14px"></i><i style="width:7px;height:7px;right:18px;bottom:-24px"></i></div>
<div class="bub say" id="psay">괴롭힐 거야?</div>
<div id="tak">딱!</div>
<div class="foot"><b>시흥시 모범택시 요금 · 경기 표준형</b>기본 <span class="num">7,000</span>원 (3km)<i>·</i>거리 <span class="num">144</span>m당 <span class="num">200</span>원<i>·</i>시간 <span class="num">35</span>초당 <span class="num">200</span>원 (15km/h 이하)<i>·</i>심야 23~04시 20%</div>
</div>
<script>
const $=id=>document.getElementById(id);
const CYC=5, OFF=1, LOOP=10;
// stars
let st='';const S=[];for(let i=0;i<34;i++){const x=(i*137.5)%760+8,y=(i*71.3)%250+70;if(x>540&&y<250||x<540&&y>80&&y<300&&x>20&&x<520&&y>90&&y<215)continue;S.push([x,y,i]);st+=`<circle id="s${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(i%3)*.4+.8}" fill="#fff4cf"/>`}
$('stars').innerHTML=st;
function wave(base,amp,len,ph){let d=`M0 456 L0 ${base}`;for(let x=0;x<=776;x+=8){d+=` L${x} ${(base+amp*Math.sin(x/len*2*Math.PI+ph)+amp*.35*Math.sin(x/(len*.47)*2*Math.PI-ph*1.7)).toFixed(2)}`}return d+' L776 456 Z'}
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const win=(t,a,b,f=.25)=>Math.min(1,Math.max(0,Math.min((t-a)/f,(b-t)/f)));
function fmt(n){return n.toLocaleString('en-US')}
function render(t){
 const k=Math.floor((t+OFF)/CYC), p=((t+OFF)%CYC)/CYC, since=(t+OFF)%CYC; // since = s after last tick
 const fare=14400+200*k;$('fare').textContent=fmt(fare);
 const pop=since<.5?1+.09*Math.sin(since/.5*Math.PI):1;$('fareBox').style.transform=`scale(${pop})`;
 const tk=k>0?since:9; // time since tick
 $('plus').style.opacity=tk<1.2?(1-tk/1.2):0;$('plus').style.transform=`translateY(${-tk*40}px)`;
 $('dist').innerHTML=((3000+144*(37+(t+OFF)/CYC))/1000).toFixed(2)+'<small>km</small>';
 const sec=18*60+32+Math.floor(t);$('tm').textContent='00:'+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 $('rem').textContent=Math.max(1,Math.round(144*(1-p)));
 const X0=28,X1=500,px=X0+(X1-X0)*p;$('trkF').setAttribute('x2',px.toFixed(1));
 // porori hop/run
 const run=t*2*Math.PI*2.4;let hop=Math.abs(Math.sin(run))*9;
 if(tk<.8){hop=Math.sin(tk/.8*Math.PI)*30}
 const pxp=Math.max(X0+50,px);
 $('poro').setAttribute('transform',`translate(${pxp.toFixed(1)} ${(284-hop).toFixed(1)}) rotate(${(tk<.8?0:Math.sin(run)*5).toFixed(2)}) scale(.86)`);
 $('ptail').setAttribute('transform',`rotate(${(Math.sin(run*.5)*8).toFixed(2)} -10 14)`);
 const leg=Math.sin(run)*4;$('pfL').setAttribute('cy',(46-Math.max(0,leg)).toFixed(1));$('pfR').setAttribute('cy',(46-Math.max(0,-leg)).toFixed(1));
 const arm=tk<.8?-30:Math.sin(run)*18;$('paL').setAttribute('transform',`rotate(${arm} -14 6)`);$('paR').setAttribute('transform',`rotate(${-arm} 14 6)`);
 const pbl=[1.3,6.1,8.4].some(b=>t>b&&t<b+.14);$('peyes').setAttribute('transform',pbl?'translate(0 -34) scale(1 .15) translate(0 34)':'');
 $('pmouth').setAttribute('transform',tk<1?'translate(0 -8) scale(1.5) translate(0 8)':'');
 // bonobono bob
 const bob=Math.sin(t*2*Math.PI/2.5)*4.5, rot=Math.sin(t*2*Math.PI/5)*3.2;
 $('bono').setAttribute('transform',`translate(668 ${(306+bob).toFixed(2)}) rotate(${rot.toFixed(2)}) scale(.82)`);
 const tap=tk<.45?Math.sin(tk/.45*Math.PI):0;
 $('barm').setAttribute('transform',`translate(0 ${(-tap*16).toFixed(1)}) rotate(${(-tap*14).toFixed(1)} 40 80)`);
 const bbl=[2.2,6.8].some(b=>t>b&&t<b+.15);$('beyes').setAttribute('transform',bbl?'translate(0 -22) scale(1 .12) translate(0 22)':'');
 const T=$('tak');T.style.opacity=tk<.7?1-tk/.7:0;T.style.left='716px';T.style.top=(318-tk*30)+'px';T.style.transform=`scale(${1+tap*.4})`;
 // bubbles
 const bth=$('bth');const show1=Math.max(win(t,.2,3.4),win(t,6.6,8.6));bth.style.opacity=show1;bth.firstChild.textContent=t<5?'언제 도착하는 걸까…':'또 올라가는 걸까…';
 bth.style.left='404px';bth.style.top=(232-bob*.3)+'px';
 const ps=$('psay');const tk1=t-(CYC-OFF);ps.style.opacity=win(t,CYC-OFF+.15,CYC-OFF+2.4);ps.style.left=(pxp-26)+'px';ps.style.top='190px';
 ps.textContent='괴롭힐 거야?';
 if(t>8.6){ps.style.opacity=win(t,LOOP-1+.15,LOOP+2);ps.textContent='포로리도 달린다!'}
 // waves
 const ph=t*2*Math.PI/LOOP;
 $('w1').setAttribute('d',wave(398,4,260,ph*2));$('w2').setAttribute('d',wave(406,5,190,-ph*3+1));$('w3').setAttribute('d',wave(428,4,150,ph*4+2));
 let g='';for(let i=0;i<9;i++){const gx=(i*91+t*28)%776,gy=420+(i%3)*10;g+=`<rect x="${gx.toFixed(1)}" y="${gy}" width="${10+(i%4)*5}" height="2" rx="1" fill="#f3d98e" opacity="${(.25+.25*Math.sin(t*3+i)).toFixed(2)}"/>`}
 g+=`<ellipse cx="505" cy="${414}" rx="${26+3*Math.sin(t*2)}" ry="3" fill="#f3d98e" opacity=".35"/>`;$('glint').innerHTML=g;
 S.forEach(([x,y,i])=>{$('s'+i).setAttribute('opacity',(.35+.6*Math.abs(Math.sin(t*1.3+i*1.7))).toFixed(2))});
 const sh=(t-7.0)/.6;const L=$('shoot');if(sh>0&&sh<1){const x=230+sh*190,y=40+sh*40;L.setAttribute('x1',x);L.setAttribute('y1',y);L.setAttribute('x2',x-34);L.setAttribute('y2',y-7);L.setAttribute('opacity',Math.sin(sh*Math.PI))}else L.setAttribute('opacity',0);
}
if(location.hash==='#cap'){window.render=render;render(0)}else{const t0=performance.now();(function f(){render(((performance.now()-t0)/1000)%LOOP);requestAnimationFrame(f)})()}
</script></body></html>
